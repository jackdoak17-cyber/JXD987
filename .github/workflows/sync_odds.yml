name: Sync Odds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch or full"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - full

concurrency:
  group: sync-odds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'patch' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Sync pre-match odds (next 14 days)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          cmd="python3 scripts/sync_odds_all_leagues.py --days-forward 14"
          if [ "$MODE" = "full" ]; then
            cmd="$cmd --refresh-squads"
          fi
          $cmd

      - name: Debug mapped participant IDs (sqlite)
        run: |
          sqlite3 data/jxd.sqlite "select selection_key, participant_id, line, market_key from odds_outcomes where fixture_id=19427629 and selection_key in ('cole_palmer_anytime','cole_palmer_1_5','morgan_rogers_0_5','wesley_fofana_0_5') order by selection_key, market_key;"

      - name: Supabase preflight check (rest)
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          resp=$(curl -sS -m 15 -w "\nHTTP:%{http_code}\n" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/odds_outcomes?select=fixture_id&limit=1")
          status=$(echo "$resp" | tail -n1 | tr -d '\r' | sed 's/HTTP://')
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "supabase_ok=true" >> "$GITHUB_OUTPUT"
            echo "Supabase reachable via REST."
          else
            echo "supabase_ok=false" >> "$GITHUB_OUTPUT"
            echo "Supabase unreachable via REST (HTTP $status). Skipping export."
          fi

      - name: Prepare psql env (IPv4)
        if: ${{ steps.preflight.outputs.supabase_ok == 'true' && env.SUPABASE_DB_URL != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "PSQL_READY=false" >> "$GITHUB_ENV"
          python3 - <<'PY' || true
          import os
          import re
          import shlex
          import socket
          import sys
          import urllib.parse

          url = os.environ.get("SUPABASE_DB_URL", "").strip()
          if not url:
              print("SUPABASE_DB_URL is empty", file=sys.stderr)
              raise SystemExit(1)

          match = re.match(r"^(?P<scheme>[a-zA-Z][a-zA-Z0-9+.-]*)://(?P<rest>.+)$", url)
          if not match:
              print("SUPABASE_DB_URL is not a valid URI", file=sys.stderr)
              raise SystemExit(1)
          scheme = match.group("scheme")
          rest = match.group("rest")

          authority, _, path_query = rest.partition("/")

          userinfo = ""
          hostport = authority
          if "@" in authority:
              userinfo, hostport = authority.rsplit("@", 1)
              userinfo = userinfo.strip()

          user = None
          password = None
          if userinfo:
              if ":" in userinfo:
                  user, password = userinfo.split(":", 1)
              else:
                  user = userinfo
              if user:
                  user = urllib.parse.unquote(user)
              if password is not None:
                  password = urllib.parse.unquote(password)

          host = None
          port = None
          if hostport.startswith("[") and "]" in hostport:
              host = hostport[1:hostport.index("]")]
              tail = hostport[hostport.index("]") + 1 :]
              if tail.startswith(":"):
                  try:
                      port = int(tail[1:])
                  except ValueError:
                      port = None
          else:
              if ":" in hostport:
                  host, port_str = hostport.rsplit(":", 1)
                  try:
                      port = int(port_str)
                  except ValueError:
                      port = None
              else:
                  host = hostport

          if host:
              host = host.strip("[]")
          if not host:
              print("Could not parse host from SUPABASE_DB_URL", file=sys.stderr)
              raise SystemExit(1)
          if port is None:
              port = 5432

          dbname = None
          query = ""
          if path_query:
              if "?" in path_query:
                  path, query = path_query.split("?", 1)
              else:
                  path = path_query
              if path:
                  dbname = urllib.parse.unquote(path)

          sslmode = "require"
          if query:
              params = dict(urllib.parse.parse_qsl(query, keep_blank_values=True))
              if params.get("sslmode"):
                  sslmode = params["sslmode"]

          try:
              infos = socket.getaddrinfo(host, port, socket.AF_INET)
          except Exception as exc:
              print(f"IPv4 lookup failed for {host}: {exc}", file=sys.stderr)
              raise SystemExit(1)
          ip = infos[0][4][0] if infos else ""
          if not ip:
              print(f"No IPv4 address found for {host}", file=sys.stderr)
              raise SystemExit(1)

          def q(val):
              return shlex.quote(str(val))

          url_ipv4 = None
          if user:
              userinfo_out = urllib.parse.quote(user, safe="")
              if password is not None:
                  userinfo_out += ":" + urllib.parse.quote(password, safe="")
              userinfo_out += "@"
          else:
              userinfo_out = ""
          hostport_ipv4 = f"{ip}:{port}" if port else ip
          url_ipv4 = f"{scheme}://{userinfo_out}{hostport_ipv4}"
          if dbname:
              url_ipv4 += f"/{urllib.parse.quote(dbname, safe='')}"
          if sslmode:
              sep = "?" if "?" not in url_ipv4 else "&"
              url_ipv4 += f"{sep}sslmode={urllib.parse.quote(sslmode, safe='')}"

          print(f"Resolved {host} -> {ip}")
          with open("/tmp/pg_env.sh", "w") as f:
              f.write(f"export PGHOSTADDR={q(ip)}\n")
              f.write(f"export PGHOST={q(host)}\n")
              f.write(f"export PGPORT={q(port)}\n")
              if user:
                  f.write(f"export PGUSER={q(user)}\n")
              if password is not None:
                  f.write(f"export PGPASSWORD={q(password)}\n")
              if dbname:
                  f.write(f"export PGDATABASE={q(dbname)}\n")
              f.write(f"export PGSSLMODE={q(sslmode)}\n")
              if url_ipv4:
                  f.write(f"export SUPABASE_DB_URL_IPV4={q(url_ipv4)}\n")
                  f.write(f"export SUPABASE_DB_URL={q(url_ipv4)}\n")
          PY
          if [ -f /tmp/pg_env.sh ]; then
            echo "PSQL_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Build odds participant patch (sqlite)
        if: steps.preflight.outputs.supabase_ok == 'true'
        run: |
          python3 scripts/build_odds_pid_patch.py --leagues "$LEAGUE_IDS" --days-forward 14 --out /tmp/odds_pid_patch.csv

      - name: Apply odds participant patch (psql)
        if: ${{ steps.preflight.outputs.supabase_ok == 'true' && env.SUPABASE_DB_URL != '' && env.PSQL_READY == 'true' }}
        run: |
          . /tmp/pg_env.sh
          cat > /tmp/apply_odds_pid_patch.sql <<'SQL'
          create table if not exists public.odds_outcomes_pid_patch (
            fixture_id bigint not null,
            bookmaker_id int not null,
            market_key text not null,
            selection_key text not null,
            line numeric null,
            participant_id bigint not null,
            participant_type text not null default 'player'
          );
          truncate public.odds_outcomes_pid_patch;
          \copy public.odds_outcomes_pid_patch (fixture_id, bookmaker_id, market_key, selection_key, line, participant_id, participant_type)
            from '/tmp/odds_pid_patch.csv' with (format csv, header true, null '');
          update public.odds_outcomes o
          set participant_id = p.participant_id,
              participant_type = p.participant_type
          from public.odds_outcomes_pid_patch p
          where o.fixture_id = p.fixture_id
            and o.bookmaker_id = p.bookmaker_id
            and o.market_key = p.market_key
            and o.selection_key = p.selection_key
            and o.line is not distinct from p.line
            and (o.participant_id is null or o.participant_id <> p.participant_id);
          select count(*) as patch_rows from public.odds_outcomes_pid_patch;
          SQL
          /usr/bin/psql -v ON_ERROR_STOP=1 -f /tmp/apply_odds_pid_patch.sql

      - name: Verify odds coverage (psql)
        if: ${{ steps.preflight.outputs.supabase_ok == 'true' && env.SUPABASE_DB_URL != '' && env.PSQL_READY == 'true' }}
        env:
          ODDS_COVERAGE_MIN_DISTINCT: 20
          ODDS_PLAYER_MAPPING_MIN_PCT: 80
        run: |
          . /tmp/pg_env.sh
          scripts/verify_odds_coverage.sh

      - name: Upload odds coverage report
        if: steps.preflight.outputs.supabase_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds_coverage_report
          path: /tmp/odds_coverage_report.json

      - name: Export odds to Supabase
        if: steps.preflight.outputs.supabase_ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/export_odds_to_supabase.py --leagues "$LEAGUE_IDS" --days-forward 14 --chunk-size 50 --timeout 120 --retries 5 --sleep 0.5

      - name: Debug mapped participant IDs (Supabase)
        if: ${{ steps.preflight.outputs.supabase_ok == 'true' && env.SUPABASE_DB_URL != '' && env.PSQL_READY == 'true' }}
        run: |
          . /tmp/pg_env.sh
          /usr/bin/psql -v ON_ERROR_STOP=1 -c "select selection_key, participant_id, line, market_key from public.odds_outcomes where fixture_id=19427629 and selection_key in ('cole_palmer_anytime','cole_palmer_1_5','morgan_rogers_0_5','wesley_fofana_0_5') order by selection_key, market_key;"

      - name: Skip patch notice
        if: ${{ steps.preflight.outputs.supabase_ok == 'true' && env.SUPABASE_DB_URL == '' }}
        run: |
          echo "SUPABASE_DB_URL not set; skipping odds participant patch and psql checks."

      - name: Skip psql notice (no IPv4)
        if: ${{ steps.preflight.outputs.supabase_ok == 'true' && env.SUPABASE_DB_URL != '' && env.PSQL_READY != 'true' }}
        run: |
          echo "No IPv4 address for Supabase DB host; skipping psql patch and coverage steps."

      - name: Skip export notice
        if: steps.preflight.outputs.supabase_ok != 'true'
        run: |
          echo "Supabase not reachable; odds export skipped."

      - name: Supabase reachability check
        if: steps.preflight.outputs.supabase_ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 -m 20 -w "\nHTTP:%{http_code}\n" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/odds_outcomes?select=selection_key,participant_id&limit=1")
          echo "$resp"
          status=$(echo "$resp" | tail -n1 | tr -d '\r' | sed 's/HTTP://')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase reachability check failed with HTTP $status"
            exit 1
          fi
