name: Sync Odds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch, prices, or full"
        required: false
        default: "prices"
        type: choice
        options:
          - patch
          - prices
          - full

concurrency:
  group: sync-odds
  cancel-in-progress: true

jobs:
  prices:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league_id: [8, 9, 384, 387, 564, 567, 82, 301, 600, 501, 444, 72]
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prices' }}
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Supabase DB preflight (psql)
        id: preflight
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          LEAGUE_ID: ${{ matrix.league_id }}
          REPORT_PATH: /tmp/odds_preflight_${{ matrix.league_id }}.json
        run: |
          set +e
          : > /tmp/odds_preflight_err_${{ matrix.league_id }}.txt
          python3 scripts/preflight_supabase_psql.py \
            --league-id "${{ matrix.league_id }}" \
            --report-out /tmp/odds_preflight_${{ matrix.league_id }}.json \
            --stderr-out /tmp/odds_preflight_err_${{ matrix.league_id }}.txt
          status=$?
          if [ $status -eq 0 ]; then
            echo "PSQL_PREFLIGHT_OK=true" >> $GITHUB_ENV
            echo "PSQL_OK=true" >> $GITHUB_ENV
          else
            echo "PSQL_PREFLIGHT_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Supabase REST preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/rest_preflight.py \
            --path "/rest/v1/odds_outcomes?select=fixture_id&limit=1" \
            --env-out "$GITHUB_ENV"

      - name: Set PGHOSTADDR from preflight
        if: env.PSQL_PREFLIGHT_OK == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(f"/tmp/odds_preflight_{os.environ['LEAGUE_ID']}.json")
          if not report.exists():
              raise SystemExit(0)
          data = json.loads(report.read_text())
          hostaddr = data.get("used_hostaddr")
          if hostaddr:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"PGHOSTADDR={hostaddr}\n")
              print(f"Using PGHOSTADDR={hostaddr}")
          PY
        env:
          LEAGUE_ID: ${{ matrix.league_id }}
        id: hostaddr
      - name: Sync pre-match odds (next 14 days)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "LEAGUES_ARG=[${{ matrix.league_id }}]"
          cmd="python3 scripts/sync_odds.py --leagues \"${{ matrix.league_id }}\" --days-forward 14 --refresh-upcoming --unmatched-out /tmp/unmatched_players_${{ matrix.league_id }}.json"
          if [ "$MODE" = "full" ]; then
            cmd="$cmd --refresh-squads"
          fi
          $cmd

      - name: Upload unmatched players
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unmatched_players_${{ matrix.league_id }}
          path: /tmp/unmatched_players_${{ matrix.league_id }}.json
          if-no-files-found: ignore

      - name: DB-direct odds ingest (psql)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
        run: |
          set +e
          set -o pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import scripts.export_odds_to_supabase_psql as m
          print(f"exporter_path={m.__file__}")
          PY
          LOG_PATH="/tmp/odds_upsert_${{ matrix.league_id }}.log"
          CSV_PATH="/tmp/odds_outcomes_export_${{ matrix.league_id }}.csv"
          : > "$LOG_PATH"
          : > /tmp/psql_err_${{ matrix.league_id }}.txt
          : > /tmp/psql_out_${{ matrix.league_id }}.txt
          : > /tmp/odds_psql_sql_${{ matrix.league_id }}.sql
          python3 scripts/export_odds_to_supabase_psql.py \
            --leagues "${{ matrix.league_id }}" \
            --days-forward 14 \
            --csv-out "$CSV_PATH" \
            --no-include-fixture-leagues \
            --progress-rows 10000 \
            --progress-fixtures 100 \
            --max-runtime-minutes 25 \
            --keep-sql \
            --report-out /tmp/odds_ingest_report_${{ matrix.league_id }}.json \
            2>&1 | tee "$LOG_PATH"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== odds upsert log tail ==="
            tail -n 200 "$LOG_PATH" || true
            echo "=== csv info ==="
            ls -la "$CSV_PATH" || true
            echo "=== csv head ==="
            head -n 3 "$CSV_PATH" || true
          fi
          if [ $status -eq 0 ]; then
            echo "INGEST_OK=true" >> $GITHUB_ENV
          else
            echo "INGEST_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_${{ matrix.league_id }}
          path: /tmp/odds_preflight_${{ matrix.league_id }}.json

      - name: Upload preflight stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_err_${{ matrix.league_id }}
          path: /tmp/odds_preflight_err_${{ matrix.league_id }}.txt

      - name: Upload odds ingest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_report_${{ matrix.league_id }}
          path: /tmp/odds_ingest_report_${{ matrix.league_id }}.json
          if-no-files-found: ignore

      - name: Upload psql error outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_psql_err_${{ matrix.league_id }}
          path: /tmp/psql_err_${{ matrix.league_id }}.txt
          if-no-files-found: ignore

      - name: Upload psql stdout outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_psql_out_${{ matrix.league_id }}
          path: /tmp/psql_out_${{ matrix.league_id }}.txt
          if-no-files-found: ignore

      - name: Upload psql SQL file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_psql_sql_${{ matrix.league_id }}
          path: /tmp/odds_psql_sql_${{ matrix.league_id }}.sql
          if-no-files-found: ignore

      - name: Upload odds upsert log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_upsert_log_${{ matrix.league_id }}
          path: /tmp/odds_upsert_${{ matrix.league_id }}.log
          if-no-files-found: ignore

      - name: Dump odds diagnostics
        if: env.PSQL_PREFLIGHT_OK == 'true' && env.INGEST_OK != 'true'
        run: |
          ls -la /tmp || true
          echo "=== upsert log tail ==="
          tail -n 200 /tmp/odds_upsert_${{ matrix.league_id }}.log || true
          echo "=== sql file head ==="
          sed -n '1,120p' /tmp/odds_psql_sql_${{ matrix.league_id }}.sql || true

      - name: Fail if preflight failed
        if: env.PSQL_PREFLIGHT_OK != 'true'
        run: |
          echo "Supabase DB preflight failed."
          exit 1

      - name: Fail if ingest failed
        if: env.PSQL_PREFLIGHT_OK == 'true' && env.INGEST_OK != 'true'
        run: |
          echo "Supabase DB ingest failed."
          exit 1

  patch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'patch' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: patch
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Supabase DB preflight (psql)
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          REPORT_PATH: /tmp/odds_preflight_patch.json
        run: |
          set +e
          : > /tmp/odds_preflight_err_patch.txt
          python3 scripts/preflight_supabase_psql.py \
            --report-out /tmp/odds_preflight_patch.json \
            --stderr-out /tmp/odds_preflight_err_patch.txt
          status=$?
          if [ $status -eq 0 ]; then
            echo "PSQL_PREFLIGHT_OK=true" >> $GITHUB_ENV
            echo "PSQL_OK=true" >> $GITHUB_ENV
          else
            echo "PSQL_PREFLIGHT_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Patch odds participants (psql)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
        run: |
          python3 scripts/patch_odds_participants_psql.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward 14 \
            --report-out /tmp/odds_patch_report.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_patch
          path: /tmp/odds_preflight_patch.json

      - name: Upload preflight stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_err_patch
          path: /tmp/odds_preflight_err_patch.txt

      - name: Upload odds patch report
        if: env.PSQL_PREFLIGHT_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds_patch_report
          path: /tmp/odds_patch_report.json

      - name: Fail if preflight failed
        if: env.PSQL_PREFLIGHT_OK != 'true'
        run: |
          echo "Supabase DB preflight failed."
          exit 1

  summary:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch')) }}
    runs-on: ubuntu-latest
    needs: prices
    env:
      ODDS_MAX_RUNTIME_MINUTES: "25"
      ODDS_COVERAGE_MIN_PCT: "50"
      ODDS_COVERAGE_REGRESSION_RATIO: "0.6"
      PRICES_RESULT: ${{ needs.prices.result }}
      EXPECTED_LEAGUES: "8,9,384,387,564,567,82,301,600,501,444,72"
    steps:
      - name: Download ingest reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports/ingest
          pattern: odds_ingest_report_*
          merge-multiple: true
        continue-on-error: true

      - name: Download preflight reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports/preflight
          pattern: odds_preflight_*
          merge-multiple: true
        continue-on-error: true

      - name: Download psql error outputs
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports/psql_err
          pattern: odds_psql_err_*
          merge-multiple: true
        continue-on-error: true

      - name: Download upsert logs
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports/upsert_logs
          pattern: odds_upsert_log_*
          merge-multiple: true
        continue-on-error: true

      - name: Summarize odds ingest reports
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ingest_dir = Path("/tmp/odds_reports/ingest")
          preflight_dir = Path("/tmp/odds_reports/preflight")
          psql_err_dir = Path("/tmp/odds_reports/psql_err")
          upsert_log_dir = Path("/tmp/odds_reports/upsert_logs")
          ingest_files = sorted(ingest_dir.glob("*.json"))
          preflight_files = sorted(preflight_dir.glob("*.json"))
          psql_err_files = {p.stem.replace("odds_psql_err_", ""): p for p in psql_err_dir.glob("*.txt")}
          upsert_log_files = {
              p.stem.replace("odds_upsert_", ""): p for p in upsert_log_dir.glob("odds_upsert_*.log")
          }

          max_runtime_min = float(os.environ.get("ODDS_MAX_RUNTIME_MINUTES", "25"))
          min_pct = float(os.environ.get("ODDS_COVERAGE_MIN_PCT", "0"))
          ratio = float(os.environ.get("ODDS_COVERAGE_REGRESSION_RATIO", "0"))
          prices_result = os.environ.get("PRICES_RESULT", "unknown")
          expected_leagues = [
              item.strip() for item in os.environ.get("EXPECTED_LEAGUES", "").split(",") if item.strip()
          ]

          failures = []
          rows = []
          preflight_errors = []

          for path in preflight_files:
              data = json.loads(path.read_text())
              if not data.get("ok", False):
                  preflight_errors.append(
                      {
                          "league_id": data.get("league_id"),
                          "host": data.get("host"),
                          "port": data.get("port"),
                          "error_class": data.get("error_class"),
                          "error_snippet": data.get("error_snippet"),
                      }
                  )

          if preflight_errors:
              print("Preflight errors:")
              for item in preflight_errors:
                  print(
                      f"- league={item['league_id']} host={item['host']} "
                      f"port={item['port']} error_class={item['error_class']} "
                      f"error_snippet={item['error_snippet']}"
                  )

          for path in ingest_files:
              data = json.loads(path.read_text())
              league_id = data.get("league_id") or "unknown"
              runtime = float(data.get("runtime_seconds", 0)) / 60.0
              inserted = data.get("rows_inserted", 0)
              updated = data.get("rows_updated", 0)
              coverage = data.get("coverage", {}).get("mapped_pct", 0) or 0
              baseline = data.get("coverage", {}).get("baseline_pct", 0) or 0
              partial = data.get("partial_run", False)
              rows.append((league_id, runtime, inserted, updated, coverage, baseline, partial))

              if runtime > max_runtime_min:
                  failures.append(f"league {league_id} runtime {runtime:.2f}m > {max_runtime_min}m")
              if coverage < min_pct:
                  failures.append(f"league {league_id} coverage {coverage:.2f}% < {min_pct}%")
              if ratio > 0 and baseline > 0:
                  min_allowed = baseline * ratio
                  if coverage < min_allowed:
                      failures.append(
                          f"league {league_id} coverage {coverage:.2f}% < baseline {baseline:.2f}% * {ratio}"
                      )

          if prices_result != "success":
              failures.append(f"prices job result was {prices_result}")

          if expected_leagues:
              seen = {str(row[0]) for row in rows}
              missing = sorted(set(expected_leagues) - seen)
              if missing:
                  failures.append(f"missing reports for leagues: {', '.join(missing)}")
                  if preflight_errors:
                      failures.append("preflight failures present (see above)")

          if not ingest_files:
              if preflight_files:
                  print("No ingest reports found; preflight failures:")
                  for path in preflight_files:
                      data = json.loads(path.read_text())
                      if not data.get("ok", False):
                          league_id = data.get("league_id", "unknown")
                          host = data.get("host")
                          port = data.get("port")
                          err_class = data.get("error_class")
                          err_snip = data.get("error_snippet")
                          print(
                              f"- league={league_id} host={host} port={port} "
                              f"error_class={err_class} error_snippet={err_snip}"
                          )
                  raise SystemExit(1)
              raise SystemExit("No ingest reports or preflight reports found.")

          print("league_id runtime_min inserted updated coverage_pct baseline_pct partial_run")
          def sort_key(item):
              league = item[0]
              try:
                  return (0, int(league))
              except Exception:
                  return (1, str(league))

          for league_id, runtime, inserted, updated, coverage, baseline, partial in sorted(rows, key=sort_key):
              print(f"{league_id} {runtime:.2f} {inserted} {updated} {coverage:.2f} {baseline:.2f} {partial}")

          if failures:
              print("Failures:")
              for item in failures:
                  print(f"- {item}")
              missing_leagues = sorted(set(expected_leagues) - {str(r[0]) for r in rows})
              def first_error_line(path):
                  if not path or not path.exists():
                      return ""
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except Exception:
                      return ""
                  for line in lines:
                      if "ERROR" in line or "FATAL" in line:
                          return line.strip()
                  for line in lines:
                      if line.strip():
                          return line.strip()
                  return ""
              for league in missing_leagues:
                  err_path = psql_err_files.get(str(league))
                  err_line = first_error_line(err_path)
                  if not err_line:
                      err_line = first_error_line(upsert_log_files.get(str(league)))
                      if err_line:
                          print(f"league {league} upsert_log: {err_line}")
                  elif err_line:
                      print(f"league {league} psql_err: {err_line}")
              raise SystemExit(1)
          PY
