name: Sync Odds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch, prices, or full"
        required: false
        default: "prices"
        type: choice
        options:
          - patch
          - prices
          - full

concurrency:
  group: sync-odds
  cancel-in-progress: true

jobs:
  prices:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league: [8, 9, 384, 387, 564, 567, 82, 301, 600, 501, 444, 72]
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prices' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Supabase DB preflight (psql)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select 1;"
          echo "PSQL_OK=true" >> $GITHUB_ENV

      - name: Supabase REST preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/rest_preflight.py \
            --path "/rest/v1/odds_outcomes?select=fixture_id&limit=1" \
            --env-out "$GITHUB_ENV"

      - name: Sync pre-match odds (next 14 days)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          cmd="python3 scripts/sync_odds.py --leagues \"${{ matrix.league }}\" --days-forward 14 --refresh-upcoming"
          if [ "$MODE" = "full" ]; then
            cmd="$cmd --refresh-squads"
          fi
          $cmd

      - name: DB-direct odds ingest (psql)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 scripts/export_odds_to_supabase_psql.py \
            --leagues "${{ matrix.league }}" \
            --days-forward 14 \
            --progress-rows 10000 \
            --progress-fixtures 100 \
            --max-runtime-minutes 25 \
            --report-out /tmp/odds_ingest_report_${{ matrix.league }}.json

      - name: Upload odds ingest report
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_report_${{ matrix.league }}
          path: /tmp/odds_ingest_report_${{ matrix.league }}.json

  patch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'patch' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: patch
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Supabase DB preflight (psql)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select 1;"
          echo "PSQL_OK=true" >> $GITHUB_ENV

      - name: Patch odds participants (psql)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 scripts/patch_odds_participants_psql.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward 14 \
            --report-out /tmp/odds_patch_report.json

      - name: Upload odds patch report
        uses: actions/upload-artifact@v4
        with:
          name: odds_patch_report
          path: /tmp/odds_patch_report.json

  summary:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch')) }}
    runs-on: ubuntu-latest
    needs: prices
    env:
      ODDS_MAX_RUNTIME_MINUTES: "25"
      ODDS_COVERAGE_MIN_PCT: "50"
      ODDS_COVERAGE_REGRESSION_RATIO: "0.6"
      PRICES_RESULT: ${{ needs.prices.result }}
      EXPECTED_LEAGUES: "8,9,384,387,564,567,82,301,600,501,444,72"
    steps:
      - name: Download ingest reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports
          pattern: odds_ingest_report_*
          merge-multiple: true

      - name: Summarize odds ingest reports
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports_dir = Path("/tmp/odds_reports")
          files = sorted(reports_dir.glob("*.json"))
          if not files:
              raise SystemExit("No ingest reports found.")

          max_runtime_min = float(os.environ.get("ODDS_MAX_RUNTIME_MINUTES", "25"))
          min_pct = float(os.environ.get("ODDS_COVERAGE_MIN_PCT", "0"))
          ratio = float(os.environ.get("ODDS_COVERAGE_REGRESSION_RATIO", "0"))
          prices_result = os.environ.get("PRICES_RESULT", "unknown")
          expected_leagues = [
              item.strip() for item in os.environ.get("EXPECTED_LEAGUES", "").split(",") if item.strip()
          ]

          failures = []
          rows = []
          for path in files:
              data = json.loads(path.read_text())
              league_id = data.get("league_id") or "unknown"
              runtime = float(data.get("runtime_seconds", 0)) / 60.0
              inserted = data.get("rows_inserted", 0)
              updated = data.get("rows_updated", 0)
              coverage = data.get("coverage", {}).get("mapped_pct", 0) or 0
              baseline = data.get("coverage", {}).get("baseline_pct", 0) or 0
              partial = data.get("partial_run", False)
              rows.append((league_id, runtime, inserted, updated, coverage, baseline, partial))

              if runtime > max_runtime_min:
                  failures.append(f"league {league_id} runtime {runtime:.2f}m > {max_runtime_min}m")
              if coverage < min_pct:
                  failures.append(f"league {league_id} coverage {coverage:.2f}% < {min_pct}%")
              if ratio > 0 and baseline > 0:
                  min_allowed = baseline * ratio
                  if coverage < min_allowed:
                      failures.append(
                          f"league {league_id} coverage {coverage:.2f}% < baseline {baseline:.2f}% * {ratio}"
                      )

          if prices_result != "success":
              failures.append(f"prices job result was {prices_result}")

          if expected_leagues:
              seen = {str(row[0]) for row in rows}
              missing = sorted(set(expected_leagues) - seen)
              if missing:
                  failures.append(f"missing reports for leagues: {', '.join(missing)}")

          print("league_id runtime_min inserted updated coverage_pct baseline_pct partial_run")
          def sort_key(item):
              league = item[0]
              try:
                  return (0, int(league))
              except Exception:
                  return (1, str(league))

          for league_id, runtime, inserted, updated, coverage, baseline, partial in sorted(rows, key=sort_key):
              print(f"{league_id} {runtime:.2f} {inserted} {updated} {coverage:.2f} {baseline:.2f} {partial}")

          if failures:
              print("Failures:")
              for item in failures:
                  print(f"- {item}")
              raise SystemExit(1)
          PY
