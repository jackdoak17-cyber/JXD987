name: Sync Odds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch, prices, or full"
        required: false
        default: "prices"
        type: choice
        options:
          - patch
          - prices
          - full
      run_coverage:
        description: "Run heavy coverage/verification queries"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: sync-odds
  cancel-in-progress: true

jobs:
  prices:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league_id: [8, 9, 384, 387, 564, 567, 82, 301, 600, 501, 444, 72]
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prices' }}
      RUN_COVERAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_coverage || 'false' }}
      PSQL_RETRIES: "3"
      PSQL_RETRY_SLEEP: "2"
      ODDS_LOCK_TIMEOUT: "0"
      ODDS_STATEMENT_TIMEOUT: "0"
      ODDS_IDLE_TX_TIMEOUT: "0"
      ODDS_ADVISORY_LOCK_KEY: "982374"
      ODDS_MARKET_ALLOWLIST: ${{ vars.ODDS_MARKET_ALLOWLIST }}
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Supabase DB preflight (psql)
        id: preflight
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          LEAGUE_ID: ${{ matrix.league_id }}
          REPORT_PATH: /tmp/odds_preflight_${{ matrix.league_id }}.json
        run: |
          set +e
          : > /tmp/odds_preflight_err_${{ matrix.league_id }}.txt
          python3 scripts/preflight_supabase_psql.py \
            --league-id "${{ matrix.league_id }}" \
            --report-out /tmp/odds_preflight_${{ matrix.league_id }}.json \
            --stderr-out /tmp/odds_preflight_err_${{ matrix.league_id }}.txt
          status=$?
          if [ $status -eq 0 ]; then
            echo "PSQL_PREFLIGHT_OK=true" >> $GITHUB_ENV
            echo "PSQL_OK=true" >> $GITHUB_ENV
          else
            echo "PSQL_PREFLIGHT_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Supabase REST preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/rest_preflight.py \
            --path "/rest/v1/odds_outcomes?select=fixture_id&limit=1" \
            --env-out "$GITHUB_ENV"

      - name: Set PGHOSTADDR from preflight
        if: env.PSQL_PREFLIGHT_OK == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(f"/tmp/odds_preflight_{os.environ['LEAGUE_ID']}.json")
          if not report.exists():
              raise SystemExit(0)
          data = json.loads(report.read_text())
          hostaddr = data.get("used_hostaddr")
          if hostaddr:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"PGHOSTADDR={hostaddr}\n")
              print(f"Using PGHOSTADDR={hostaddr}")
          PY
        env:
          LEAGUE_ID: ${{ matrix.league_id }}
        id: hostaddr
      - name: Sync pre-match odds (next 14 days)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "LEAGUES_ARG=[${{ matrix.league_id }}]"
          cmd="python3 scripts/sync_odds.py --leagues \"${{ matrix.league_id }}\" --days-forward 14 --refresh-upcoming --unmatched-out /tmp/unmatched_players_${{ matrix.league_id }}.json"
          if [ "$MODE" = "full" ]; then
            cmd="$cmd --refresh-squads"
          fi
          $cmd

      - name: Upload unmatched players
        if: false
        run: echo "Skipping unmatched players artifact."

      - name: DB-direct odds ingest (psql)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
        run: |
          set +e
          set -o pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import scripts.export_odds_to_supabase_psql as m
          print(f"exporter_path={m.__file__}")
          PY
          LOG_PATH="/tmp/odds_upsert_${{ matrix.league_id }}.log"
          CSV_PATH="/tmp/odds_outcomes_export_${{ matrix.league_id }}.csv"
          : > "$LOG_PATH"
          : > /tmp/psql_err_${{ matrix.league_id }}.txt
          : > /tmp/psql_out_${{ matrix.league_id }}.txt
          : > /tmp/odds_psql_sql_${{ matrix.league_id }}.sql
          COVERAGE_ARGS=""
          RETENTION_ARGS="--skip-retention --skip-retention-snapshots"
          if [ "${RUN_COVERAGE}" != "true" ] && [ "${RUN_COVERAGE}" != "1" ]; then
            COVERAGE_ARGS="--skip-coverage --skip-verification"
          fi
          python3 scripts/export_odds_to_supabase_psql.py \
            --leagues "${{ matrix.league_id }}" \
            --days-forward 14 \
            --csv-out "$CSV_PATH" \
            --no-include-fixture-leagues \
            --progress-rows 10000 \
            --progress-fixtures 100 \
            --max-runtime-minutes 25 \
            --keep-sql \
            --report-out /tmp/odds_ingest_report_${{ matrix.league_id }}.json \
            $RETENTION_ARGS \
            $COVERAGE_ARGS \
            2>&1 | tee "$LOG_PATH"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== odds upsert log tail ==="
            tail -n 200 "$LOG_PATH" || true
            echo "=== csv info ==="
            ls -la "$CSV_PATH" || true
            echo "=== csv head ==="
            head -n 3 "$CSV_PATH" || true
            tail -n 200 "$LOG_PATH" > /tmp/odds_ingest_error_${{ matrix.league_id }}.txt
          fi
          if [ $status -eq 0 ]; then
            echo "INGEST_OK=true" >> $GITHUB_ENV
            rm -f /tmp/odds_ingest_error_${{ matrix.league_id }}.txt
          else
            echo "INGEST_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Upload preflight report
        if: false
        run: echo "Skipping preflight artifact."

      - name: Upload preflight stderr
        if: false
        run: echo "Skipping preflight stderr artifact."

      - name: Upload odds ingest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_report_${{ matrix.league_id }}
          path: /tmp/odds_ingest_report_${{ matrix.league_id }}.json
          if-no-files-found: ignore

      - name: Upload odds ingest error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_error_${{ matrix.league_id }}
          path: /tmp/odds_ingest_error_${{ matrix.league_id }}.txt
          if-no-files-found: ignore

      - name: Dump odds diagnostics
        if: env.PSQL_PREFLIGHT_OK == 'true' && env.INGEST_OK != 'true'
        run: |
          ls -la /tmp || true
          echo "=== upsert log tail ==="
          tail -n 200 /tmp/odds_upsert_${{ matrix.league_id }}.log || true
          echo "=== sql file head ==="
          sed -n '1,120p' /tmp/odds_psql_sql_${{ matrix.league_id }}.sql || true

      - name: Fail if preflight failed
        if: env.PSQL_PREFLIGHT_OK != 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          league_id = os.environ.get("LEAGUE_ID", "unknown")
          report_path = Path(f"/tmp/odds_ingest_report_{league_id}.json")
          error_path = Path(f"/tmp/odds_ingest_error_{league_id}.txt")
          preflight_path = Path(f"/tmp/odds_preflight_{league_id}.json")
          err_path = Path(f"/tmp/odds_preflight_err_{league_id}.txt")
          raw_allowlist = os.environ.get("ODDS_MARKET_ALLOWLIST", "").strip()
          allowlist_enabled = raw_allowlist.lower() not in {"all", "*"}
          report = {
              "ok": False,
              "error_stage": "preflight",
              "error_message": err_path.read_text(encoding="utf-8") if err_path.exists() else "preflight_failed",
              "league_id": int(league_id) if str(league_id).isdigit() else league_id,
              "allowlist_enabled": allowlist_enabled,
              "allowlist_keys": raw_allowlist if raw_allowlist else None,
          }
          if preflight_path.exists():
              try:
                  report["preflight"] = json.loads(preflight_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  report["preflight"] = {"raw": preflight_path.read_text(encoding="utf-8")}
          report_path.write_text(json.dumps(report, indent=2), encoding="utf-8")
          error_path.write_text(report.get("error_message") or "preflight_failed", encoding="utf-8")
          print(f"Wrote preflight report to {report_path}")
          PY
          echo "Supabase DB preflight failed."
          exit 1
        env:
          LEAGUE_ID: ${{ matrix.league_id }}
          ODDS_MARKET_ALLOWLIST: ${{ vars.ODDS_MARKET_ALLOWLIST }}

      - name: Fail if ingest failed
        if: env.PSQL_PREFLIGHT_OK == 'true' && env.INGEST_OK != 'true'
        run: |
          echo "Supabase DB ingest failed."
          exit 1

  patch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'patch' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: patch
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Supabase DB preflight (psql)
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          REPORT_PATH: /tmp/odds_preflight_patch.json
        run: |
          set +e
          : > /tmp/odds_preflight_err_patch.txt
          python3 scripts/preflight_supabase_psql.py \
            --report-out /tmp/odds_preflight_patch.json \
            --stderr-out /tmp/odds_preflight_err_patch.txt
          status=$?
          if [ $status -eq 0 ]; then
            echo "PSQL_PREFLIGHT_OK=true" >> $GITHUB_ENV
            echo "PSQL_OK=true" >> $GITHUB_ENV
          else
            echo "PSQL_PREFLIGHT_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Patch odds participants (psql)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
        run: |
          python3 scripts/patch_odds_participants_psql.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward 14 \
            --report-out /tmp/odds_patch_report.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_patch
          path: /tmp/odds_preflight_patch.json

      - name: Upload preflight stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_err_patch
          path: /tmp/odds_preflight_err_patch.txt

      - name: Upload odds patch report
        if: env.PSQL_PREFLIGHT_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds_patch_report
          path: /tmp/odds_patch_report.json

      - name: Fail if preflight failed
        if: env.PSQL_PREFLIGHT_OK != 'true'
        run: |
          echo "Supabase DB preflight failed."
          exit 1

  summary:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch')) }}
    runs-on: ubuntu-latest
    needs: prices
    env:
      ODDS_MAX_RUNTIME_MINUTES: "25"
      ODDS_COVERAGE_MIN_PCT: "50"
      ODDS_COVERAGE_REGRESSION_RATIO: "0.6"
      STRICT_COVERAGE: "0"
      RUN_COVERAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_coverage || 'false' }}
      PRICES_RESULT: ${{ needs.prices.result }}
      EXPECTED_LEAGUES: "8,9,384,387,564,567,82,301,600,501,444,72"
    steps:
      - name: Download ingest reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports/ingest
          pattern: odds_ingest_report_*
          merge-multiple: true
        continue-on-error: true

      - name: Summarize odds ingest reports
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ingest_dir = Path("/tmp/odds_reports/ingest")
          ingest_files = sorted(ingest_dir.glob("*.json"))
          preflight_errors = []

          max_runtime_min = float(os.environ.get("ODDS_MAX_RUNTIME_MINUTES", "25"))
          min_pct = float(os.environ.get("ODDS_COVERAGE_MIN_PCT", "0"))
          ratio = float(os.environ.get("ODDS_COVERAGE_REGRESSION_RATIO", "0"))
          strict_coverage = os.environ.get("STRICT_COVERAGE", "0").lower() in {"1", "true", "yes"}
          prices_result = os.environ.get("PRICES_RESULT", "unknown")
          run_coverage = os.environ.get("RUN_COVERAGE", "false").lower() in {"1", "true", "yes"}
          expected_leagues = [
              item.strip() for item in os.environ.get("EXPECTED_LEAGUES", "").split(",") if item.strip()
          ]
          if not run_coverage:
              min_pct = 0.0
              ratio = 0.0

          failures = []
          warnings = []
          rows = []
          prices_cancelled = prices_result == "cancelled"

          for path in ingest_files:
              data = json.loads(path.read_text())
              league_id = data.get("league_id") or "unknown"
              runtime = float(data.get("runtime_seconds", 0)) / 60.0
              inserted = data.get("rows_inserted", 0)
              updated = data.get("rows_updated", 0)
              coverage = data.get("coverage", {}).get("mapped_pct", 0) or 0
              baseline = data.get("coverage", {}).get("baseline_pct", 0) or 0
              partial = data.get("partial_run", False)
              ok = data.get("ok", True)
              error_stage = data.get("error_stage")
              error_message = data.get("error_message")
              rows.append((league_id, runtime, inserted, updated, coverage, baseline, partial))

              if not ok:
                  failures.append(f"league {league_id} failed ({error_stage}): {error_message}")
              if partial:
                  failures.append(f"league {league_id} partial_run=true")
              if runtime > max_runtime_min:
                  (failures if strict_coverage else warnings).append(
                      f"league {league_id} runtime {runtime:.2f}m > {max_runtime_min}m"
                  )
              if coverage < min_pct:
                  (failures if strict_coverage else warnings).append(
                      f"league {league_id} coverage {coverage:.2f}% < {min_pct}%"
                  )
              if ratio > 0 and baseline > 0:
                  min_allowed = baseline * ratio
                  if coverage < min_allowed:
                      (failures if strict_coverage else warnings).append(
                          f"league {league_id} coverage {coverage:.2f}% < baseline {baseline:.2f}% * {ratio}"
                      )

          if prices_result != "success":
              failures.append(f"prices job result was {prices_result}")

          if expected_leagues:
              seen = {str(row[0]) for row in rows}
              missing = sorted(set(expected_leagues) - seen)
              if missing:
                  if prices_cancelled:
                      warnings.append(f"missing reports for leagues (matrix cancelled): {', '.join(missing)}")
                  else:
                      failures.append(f"missing reports for leagues: {', '.join(missing)}")
                      if preflight_errors:
                          failures.append("preflight failures present (see above)")

          if not ingest_files:
              if prices_cancelled:
                  raise SystemExit(0)
              raise SystemExit("No ingest reports or preflight reports found.")

          print("league_id runtime_min inserted updated coverage_pct baseline_pct partial_run")
          def sort_key(item):
              league = item[0]
              try:
                  return (0, int(league))
              except Exception:
                  return (1, str(league))

          for league_id, runtime, inserted, updated, coverage, baseline, partial in sorted(rows, key=sort_key):
              print(f"{league_id} {runtime:.2f} {inserted} {updated} {coverage:.2f} {baseline:.2f} {partial}")

          if warnings:
              print("Warnings:")
              for item in warnings:
                  print(f"- {item}")

          if failures:
              print("Failures:")
              for item in failures:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

  retention:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch')) }}
    runs-on: ubuntu-latest
    needs: prices
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run odds retention
        run: |
          python3 scripts/odds_retention_psql.py \
            --days-back 1 \
            --days-forward 14 \
            --snapshot-days 30 \
            --report-out /tmp/odds_retention_report.json

      - name: Upload retention report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_retention_report
          path: /tmp/odds_retention_report.json
