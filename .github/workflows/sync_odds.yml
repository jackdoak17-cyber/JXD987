name: Sync Odds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch or full"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - full

concurrency:
  group: sync-odds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'patch' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Sync pre-match odds (next 14 days)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          cmd="python3 scripts/sync_odds_all_leagues.py --days-forward 14"
          if [ "$MODE" = "full" ]; then
            cmd="$cmd --refresh-squads"
          fi
          $cmd

      - name: Debug mapped participant IDs (sqlite)
        run: |
          sqlite3 data/jxd.sqlite "select selection_key, participant_id, line, market_key from odds_outcomes where fixture_id=19427629 and selection_key in ('cole_palmer_anytime','cole_palmer_1_5','morgan_rogers_0_5','wesley_fofana_0_5') order by selection_key, market_key;"

      - name: Supabase preflight check (rest)
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          resp=$(curl -sS -m 30 --retry 3 --retry-all-errors --retry-delay 5 -w "\nHTTP:%{http_code}\n" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/odds_outcomes?select=fixture_id&limit=1")
          status=$(echo "$resp" | tail -n1 | tr -d '\r' | sed 's/HTTP://')
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "supabase_ok=true" >> "$GITHUB_OUTPUT"
            echo "Supabase reachable via REST."
          else
            echo "supabase_ok=false" >> "$GITHUB_OUTPUT"
            echo "Supabase unreachable via REST (HTTP $status). Continuing anyway."
          fi

      - name: Export odds to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/export_odds_to_supabase.py --leagues "$LEAGUE_IDS" --days-forward 14 --skip-snapshots --chunk-size 25 --timeout 120 --retries 8 --sleep 0.5

      - name: Patch odds participants (REST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/patch_odds_participants_rest.py --leagues "$LEAGUE_IDS" --days-forward 14 --chunk-size 300 --timeout 120 --retries 8 --sleep 0.5

      - name: Supabase reachability check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 -m 20 -w "\nHTTP:%{http_code}\n" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/odds_outcomes?select=selection_key,participant_id&limit=1")
          echo "$resp"
          status=$(echo "$resp" | tail -n1 | tr -d '\r' | sed 's/HTTP://')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase reachability check failed with HTTP $status"
            exit 1
          fi

      - name: Verify odds counts (REST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/verify_odds_rest.py
