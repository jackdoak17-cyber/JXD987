name: Sync Odds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch, prices, or full"
        required: false
        default: "prices"
        type: choice
        options:
          - patch
          - prices
          - full
      run_coverage:
        description: "Run heavy coverage/verification queries"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      league_ids:
        description: "Optional comma-separated league IDs to run (blank runs the configured odds leagues)"
        required: false
        default: ""
        type: string

concurrency:
  group: sync-odds
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      league_ids: ${{ steps.ids.outputs.league_ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build configured odds league matrix
        id: ids
        shell: bash
        env:
          REQUESTED_LEAGUE_IDS: ${{ inputs.league_ids || '' }}
        run: |
          set -euo pipefail
          excluded_ids="$(jq -c '.' config/odds_api_sync_excluded_leagues.json)"
          if [[ -n "$REQUESTED_LEAGUE_IDS" ]]; then
            league_ids="$(jq -cn --arg raw "$REQUESTED_LEAGUE_IDS" '$raw | split(",") | map(select(length > 0) | tonumber) | unique | sort')"
            if jq -e --argjson excluded "$excluded_ids" 'any(.[]; . as $id | ($excluded | index($id)) != null)' <<<"$league_ids" >/dev/null; then
              echo "Requested odds leagues include competitions excluded by config/odds_api_sync_excluded_leagues.json" >&2
              exit 1
            fi
          else
            league_ids="$(jq -c --argjson excluded "$excluded_ids" 'keys | map(tonumber) | map(select(. as $id | ($excluded | index($id)) == null)) | sort' config/odds_api_leagues.json)"
          fi
          [[ "$league_ids" != "[]" ]]
          echo "league_ids=$league_ids" >> "$GITHUB_OUTPUT"
          echo "Running odds sync for leagues: $league_ids"

  prices:
    needs: plan
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch') }}
    runs-on: ubuntu-latest
    # A provider/API stall must fail visibly instead of holding the matrix
    # queue indefinitely and masking the next scheduled refresh.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The previous hard-coded 12-league matrix silently skipped every other
      # configured league. Three shards keep the full 30-league refresh within
      # the schedule interval without creating an unbounded provider burst.
      max-parallel: 3
      matrix:
        league_id: ${{ fromJSON(needs.plan.outputs.league_ids) }}
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prices' }}
      RUN_COVERAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_coverage || 'false' }}
      PSQL_RETRIES: "3"
      PSQL_RETRY_SLEEP: "2"
      ODDS_LOCK_TIMEOUT: "0"
      ODDS_STATEMENT_TIMEOUT: "0"
      ODDS_IDLE_TX_TIMEOUT: "0"
      ODDS_ADVISORY_LOCK_KEY: "982374"
      ODDS_MARKET_ALLOWLIST: ${{ vars.ODDS_MARKET_ALLOWLIST }}
      # Keep this list within the bookmaker selection allowed by the active
      # Odds API account. A disallowed name makes /odds/multi return 403 and
      # prevents every league shard from restoring odds.
      ODDS_BOOKMAKERS: "Bet365,Paddy Power,Unibet,BetMGM"
      ODDS_API_RETRIES: ${{ vars.ODDS_API_RETRIES || '3' }}
      ODDS_API_SLEEP_BASE: ${{ vars.ODDS_API_SLEEP_BASE || '1' }}
      ODDS_API_SLEEP_MAX: ${{ vars.ODDS_API_SLEEP_MAX || '10' }}
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile odds scripts
        run: |
          python -m py_compile \
            scripts/export_odds_to_supabase_psql.py \
            scripts/sync_odds.py \
            scripts/odds_retention_psql.py \
            scripts/patch_odds_participants_psql.py

      - name: Run odds matcher regression tests
        run: python -m unittest tests.test_sync_odds_matcher

      - name: Run moneyline coverage validator unit tests
        run: python -m unittest tests.test_validate_moneyline_coverage

      - name: Supabase DB preflight (psql)
        id: preflight
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          JXD_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          LEAGUE_ID: ${{ matrix.league_id }}
          REPORT_PATH: /tmp/odds_preflight_${{ matrix.league_id }}.json
        run: |
          set +e
          : > /tmp/odds_preflight_err_${{ matrix.league_id }}.txt
          python3 scripts/preflight_supabase_psql.py \
            --league-id "${{ matrix.league_id }}" \
            --report-out /tmp/odds_preflight_${{ matrix.league_id }}.json \
            --stderr-out /tmp/odds_preflight_err_${{ matrix.league_id }}.txt
          status=$?
          if [ $status -eq 0 ]; then
            echo "PSQL_PREFLIGHT_OK=true" >> $GITHUB_ENV
            echo "PSQL_OK=true" >> $GITHUB_ENV
          else
            echo "PSQL_PREFLIGHT_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Supabase REST preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/rest_preflight.py \
            --path "/rest/v1/odds_outcomes?select=fixture_id&limit=1" \
            --env-out "$GITHUB_ENV"

      - name: Set PGHOSTADDR from preflight
        if: env.PSQL_PREFLIGHT_OK == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(f"/tmp/odds_preflight_{os.environ['LEAGUE_ID']}.json")
          if not report.exists():
              raise SystemExit(0)
          data = json.loads(report.read_text())
          hostaddr = data.get("used_hostaddr")
          if hostaddr:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"PGHOSTADDR={hostaddr}\n")
              print(f"Using PGHOSTADDR={hostaddr}")
          PY
        env:
          LEAGUE_ID: ${{ matrix.league_id }}
        id: hostaddr
      - name: Sync pre-match odds (next 14 days)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "LEAGUES_ARG=[${{ matrix.league_id }}]"
          # Include the previous day so same-day fixtures that finish before
          # their queued league shard runs still receive the provider's
          # historical pre-kickoff odds.
          python3 scripts/sync_odds.py \
            --leagues "${{ matrix.league_id }}" \
            --days-back 1 \
            --days-forward 14 \
            --refresh-upcoming \
            --bookmakers "${ODDS_BOOKMAKERS}" \
            --report-out /tmp/odds_sync_report_${{ matrix.league_id }}.json \
            --unmatched-out /tmp/unmatched_players_${{ matrix.league_id }}.json

      - name: Upload unmatched players
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unmatched_players_${{ matrix.league_id }}
          path: /tmp/unmatched_players_${{ matrix.league_id }}.json
          if-no-files-found: ignore

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_sync_report_${{ matrix.league_id }}
          path: /tmp/odds_sync_report_${{ matrix.league_id }}.json
          if-no-files-found: ignore

      - name: DB-direct odds ingest (psql)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          ODDS_SYNC_REPORT_PATH: /tmp/odds_sync_report_${{ matrix.league_id }}.json
        run: |
          set +e
          set -o pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import scripts.export_odds_to_supabase_psql as m
          print(f"exporter_path={m.__file__}")
          PY
          LOG_PATH="/tmp/odds_upsert_${{ matrix.league_id }}.log"
          CSV_PATH="/tmp/odds_outcomes_export_${{ matrix.league_id }}.csv"
          : > "$LOG_PATH"
          : > /tmp/psql_err_${{ matrix.league_id }}.txt
          : > /tmp/psql_out_${{ matrix.league_id }}.txt
          : > /tmp/odds_psql_sql_${{ matrix.league_id }}.sql
          COVERAGE_ARGS=""
          RETENTION_ARGS="--skip-retention --skip-retention-snapshots"
          if [ "${RUN_COVERAGE}" != "true" ] && [ "${RUN_COVERAGE}" != "1" ]; then
            COVERAGE_ARGS="--skip-coverage --skip-verification"
          fi
          python3 scripts/export_odds_to_supabase_psql.py \
            --leagues "${{ matrix.league_id }}" \
            --days-forward 14 \
            --csv-out "$CSV_PATH" \
            --no-include-fixture-leagues \
            --progress-rows 10000 \
            --progress-fixtures 100 \
            --max-runtime-minutes 25 \
            --keep-sql \
            --report-out /tmp/odds_ingest_report_${{ matrix.league_id }}.json \
            $RETENTION_ARGS \
            $COVERAGE_ARGS \
            2>&1 | tee "$LOG_PATH"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== odds upsert log tail ==="
            tail -n 200 "$LOG_PATH" || true
            echo "=== csv info ==="
            ls -la "$CSV_PATH" || true
            echo "=== csv head ==="
            head -n 3 "$CSV_PATH" || true
            tail -n 200 "$LOG_PATH" > /tmp/odds_ingest_error_${{ matrix.league_id }}.txt
          fi
          if [ $status -eq 0 ]; then
            echo "INGEST_OK=true" >> $GITHUB_ENV
            rm -f /tmp/odds_ingest_error_${{ matrix.league_id }}.txt
          else
            echo "INGEST_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Upload preflight report
        if: false
        run: echo "Skipping preflight artifact."

      - name: Upload preflight stderr
        if: false
        run: echo "Skipping preflight stderr artifact."

      - name: Upload odds ingest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_report_${{ matrix.league_id }}
          path: /tmp/odds_ingest_report_${{ matrix.league_id }}.json
          if-no-files-found: ignore

      - name: Validate 7-day moneyline coverage
        # Coverage can be below 100% when the upstream provider has not
        # released a market yet or has no event for a competition. Preserve
        # the report as an actionable warning without marking a successful
        # odds ingest as a failed GitHub job; Operations audits the live card
        # and records the exact missing fixture IDs separately.
        continue-on-error: true
        if: env.INGEST_OK == 'true'
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
        run: |
          python3 scripts/validate_moneyline_coverage.py \
            --leagues "${{ matrix.league_id }}" \
            --days-forward 7 \
            --fail-below-pct 100 \
            --provider-report "/tmp/odds_sync_report_${{ matrix.league_id }}.json" \
            --out-json /tmp/moneyline_coverage_${{ matrix.league_id }}.json \
            --out-md /tmp/moneyline_coverage_${{ matrix.league_id }}.md

      - name: Upload moneyline coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyline_coverage_${{ matrix.league_id }}
          path: |
            /tmp/moneyline_coverage_${{ matrix.league_id }}.json
            /tmp/moneyline_coverage_${{ matrix.league_id }}.md
          if-no-files-found: ignore

      - name: Upload odds ingest error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_error_${{ matrix.league_id }}
          path: /tmp/odds_ingest_error_${{ matrix.league_id }}.txt
          if-no-files-found: ignore

      - name: Dump odds diagnostics
        if: env.PSQL_PREFLIGHT_OK == 'true' && env.INGEST_OK != 'true'
        run: |
          ls -la /tmp || true
          echo "=== upsert log tail ==="
          tail -n 200 /tmp/odds_upsert_${{ matrix.league_id }}.log || true
          echo "=== sql file head ==="
          sed -n '1,120p' /tmp/odds_psql_sql_${{ matrix.league_id }}.sql || true

      - name: Fail if preflight failed
        if: env.PSQL_PREFLIGHT_OK != 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          league_id = os.environ.get("LEAGUE_ID", "unknown")
          report_path = Path(f"/tmp/odds_ingest_report_{league_id}.json")
          error_path = Path(f"/tmp/odds_ingest_error_{league_id}.txt")
          preflight_path = Path(f"/tmp/odds_preflight_{league_id}.json")
          err_path = Path(f"/tmp/odds_preflight_err_{league_id}.txt")
          raw_allowlist = os.environ.get("ODDS_MARKET_ALLOWLIST", "").strip()
          allowlist_enabled = raw_allowlist.lower() not in {"all", "*"}
          report = {
              "ok": False,
              "error_stage": "preflight",
              "error_message": err_path.read_text(encoding="utf-8") if err_path.exists() else "preflight_failed",
              "league_id": int(league_id) if str(league_id).isdigit() else league_id,
              "allowlist_enabled": allowlist_enabled,
              "allowlist_keys": raw_allowlist if raw_allowlist else None,
          }
          if preflight_path.exists():
              try:
                  report["preflight"] = json.loads(preflight_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  report["preflight"] = {"raw": preflight_path.read_text(encoding="utf-8")}
          report_path.write_text(json.dumps(report, indent=2), encoding="utf-8")
          error_path.write_text(report.get("error_message") or "preflight_failed", encoding="utf-8")
          print(f"Wrote preflight report to {report_path}")
          PY
          echo "Supabase DB preflight failed."
          exit 1
        env:
          LEAGUE_ID: ${{ matrix.league_id }}
          ODDS_MARKET_ALLOWLIST: ${{ vars.ODDS_MARKET_ALLOWLIST }}

      - name: Fail if ingest failed
        if: env.PSQL_PREFLIGHT_OK == 'true' && env.INGEST_OK != 'true'
        run: |
          echo "Supabase DB ingest failed."
          exit 1

  patch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'patch' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: patch
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Supabase DB preflight (psql)
        continue-on-error: true
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
          REPORT_PATH: /tmp/odds_preflight_patch.json
        run: |
          set +e
          : > /tmp/odds_preflight_err_patch.txt
          python3 scripts/preflight_supabase_psql.py \
            --report-out /tmp/odds_preflight_patch.json \
            --stderr-out /tmp/odds_preflight_err_patch.txt
          status=$?
          if [ $status -eq 0 ]; then
            echo "PSQL_PREFLIGHT_OK=true" >> $GITHUB_ENV
            echo "PSQL_OK=true" >> $GITHUB_ENV
          else
            echo "PSQL_PREFLIGHT_OK=false" >> $GITHUB_ENV
          fi
          exit 0

      - name: Patch odds participants (psql)
        if: env.PSQL_PREFLIGHT_OK == 'true'
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PGSSLMODE: require
        run: |
          python3 scripts/patch_odds_participants_psql.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward 14 \
            --report-out /tmp/odds_patch_report.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_patch
          path: /tmp/odds_preflight_patch.json

      - name: Upload preflight stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_preflight_err_patch
          path: /tmp/odds_preflight_err_patch.txt

      - name: Upload odds patch report
        if: env.PSQL_PREFLIGHT_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds_patch_report
          path: /tmp/odds_patch_report.json

      - name: Fail if preflight failed
        if: env.PSQL_PREFLIGHT_OK != 'true'
        run: |
          echo "Supabase DB preflight failed."
          exit 1

  summary:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch')) }}
    runs-on: ubuntu-latest
    needs: [plan, prices, retention]
    env:
      ODDS_MAX_RUNTIME_MINUTES: "25"
      ODDS_COVERAGE_MIN_PCT: "50"
      ODDS_COVERAGE_REGRESSION_RATIO: "0.6"
      STRICT_COVERAGE: "0"
      RUN_COVERAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_coverage || 'false' }}
      PRICES_RESULT: ${{ needs.prices.result }}
      RETENTION_RESULT: ${{ needs.retention.result }}
      EXPECTED_LEAGUES: ${{ inputs.league_ids || join(fromJSON(needs.plan.outputs.league_ids), ',') }}
    steps:
      - name: Download ingest reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/odds_reports/ingest
          pattern: odds_ingest_report_*
          merge-multiple: true
        continue-on-error: true

      - name: Summarize odds ingest reports
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ingest_dir = Path("/tmp/odds_reports/ingest")
          ingest_files = sorted(ingest_dir.glob("*.json"))
          preflight_errors = []

          max_runtime_min = float(os.environ.get("ODDS_MAX_RUNTIME_MINUTES", "25"))
          min_pct = float(os.environ.get("ODDS_COVERAGE_MIN_PCT", "0"))
          ratio = float(os.environ.get("ODDS_COVERAGE_REGRESSION_RATIO", "0"))
          strict_coverage = os.environ.get("STRICT_COVERAGE", "0").lower() in {"1", "true", "yes"}
          prices_result = os.environ.get("PRICES_RESULT", "unknown")
          retention_result = os.environ.get("RETENTION_RESULT", "unknown")
          run_coverage = os.environ.get("RUN_COVERAGE", "false").lower() in {"1", "true", "yes"}
          expected_leagues = [
              item.strip() for item in os.environ.get("EXPECTED_LEAGUES", "").split(",") if item.strip()
          ]
          if not run_coverage:
              min_pct = 0.0
              ratio = 0.0

          failures = []
          warnings = []
          rows = []
          prices_cancelled = prices_result == "cancelled"

          for path in ingest_files:
              data = json.loads(path.read_text())
              league_id = data.get("league_id") or "unknown"
              runtime = float(data.get("runtime_seconds", 0)) / 60.0
              inserted = data.get("rows_inserted", 0)
              updated = data.get("rows_updated", 0)
              coverage = data.get("coverage", {}).get("mapped_pct", 0) or 0
              baseline = data.get("coverage", {}).get("baseline_pct", 0) or 0
              partial = data.get("partial_run", False)
              ok = data.get("ok", True)
              error_stage = data.get("error_stage")
              error_message = data.get("error_message")
              rows.append((league_id, runtime, inserted, updated, coverage, baseline, partial))

              if not ok:
                  failures.append(f"league {league_id} failed ({error_stage}): {error_message}")
              if partial:
                  failures.append(f"league {league_id} partial_run=true")
              if runtime > max_runtime_min:
                  (failures if strict_coverage else warnings).append(
                      f"league {league_id} runtime {runtime:.2f}m > {max_runtime_min}m"
                  )
              if coverage < min_pct:
                  (failures if strict_coverage else warnings).append(
                      f"league {league_id} coverage {coverage:.2f}% < {min_pct}%"
                  )
              if ratio > 0 and baseline > 0:
                  min_allowed = baseline * ratio
                  if coverage < min_allowed:
                      (failures if strict_coverage else warnings).append(
                          f"league {league_id} coverage {coverage:.2f}% < baseline {baseline:.2f}% * {ratio}"
                      )

          if prices_result == "failure":
              failures.append(f"prices job result was {prices_result}")
          elif prices_result == "cancelled":
              warnings.append(f"prices job result was {prices_result}")

          if retention_result != "success":
              failures.append(f"retention job result was {retention_result}")

          if expected_leagues:
              seen = {str(row[0]) for row in rows}
              missing = sorted(set(expected_leagues) - seen)
              if missing:
                  if prices_cancelled:
                      warnings.append(f"missing reports for leagues (matrix cancelled): {', '.join(missing)}")
                  else:
                      failures.append(f"missing reports for leagues: {', '.join(missing)}")
                      if preflight_errors:
                          failures.append("preflight failures present (see above)")

          if not ingest_files:
              raise SystemExit("No ingest reports found; treating as failure.")

          print("league_id runtime_min inserted updated coverage_pct baseline_pct partial_run")
          def sort_key(item):
              league = item[0]
              try:
                  return (0, int(league))
              except Exception:
                  return (1, str(league))

          for league_id, runtime, inserted, updated, coverage, baseline, partial in sorted(rows, key=sort_key):
              print(f"{league_id} {runtime:.2f} {inserted} {updated} {coverage:.2f} {baseline:.2f} {partial}")

          if warnings:
              print("Warnings:")
              for item in warnings:
                  print(f"- {item}")

          if failures:
              print("Failures:")
              for item in failures:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

  retention:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'patch')) }}
    runs-on: ubuntu-latest
    needs: prices
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
      RETENTION_MAX_PAST24H_ROWS: "10000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Compile retention script
        run: |
          python -m py_compile scripts/odds_retention_psql.py

      - name: Run odds retention
        run: |
          python3 scripts/odds_retention_psql.py \
            --days-back 1 \
            --days-forward 14 \
            --snapshot-days 30 \
            --report-out /tmp/odds_retention_report.json

      - name: Upload retention report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_retention_report
          path: /tmp/odds_retention_report.json

      - name: Enforce retention invariant
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          max_rows = int(os.environ.get("RETENTION_MAX_PAST24H_ROWS", "10000"))
          report_path = Path("/tmp/odds_retention_report.json")
          if not report_path.exists():
              raise SystemExit("Missing odds_retention_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          past_rows = int(report.get("odds_rows_past_24h", 0))
          if past_rows <= max_rows:
              print("Retention OK: past24h rows={} <= {}".format(past_rows, max_rows))
              raise SystemExit(0)
          print("Retention FAIL: past24h rows={} > {}".format(past_rows, max_rows))
          print("Top markets past 24h:")
          for item in report.get("past_24h_market_top", []):
              print("- {}: {}".format(item.get("market_key"), item.get("rows")))
          print("League breakdown past 24h:")
          for item in report.get("past_24h_league_top", []):
              print("- {}: {}".format(item.get("league_id"), item.get("rows")))
          range_info = report.get("past_24h_range", {}) or {}
          print("Starting_at range past 24h:")
          print("- min: {}".format(range_info.get("min_starting_at")))
          print("- max: {}".format(range_info.get("max_starting_at")))
          raise SystemExit(1)
          PY
