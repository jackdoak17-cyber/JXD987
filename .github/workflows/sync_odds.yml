name: Sync Odds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: patch, prices, or full"
        required: false
        default: "prices"
        type: choice
        options:
          - patch
          - prices
          - full

concurrency:
  group: sync-odds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prices' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Supabase DB preflight (psql)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select 1;"
          echo "PSQL_OK=true" >> $GITHUB_ENV

      - name: Supabase REST preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/rest_preflight.py \
            --path "/rest/v1/odds_outcomes?select=fixture_id&limit=1" \
            --env-out "$GITHUB_ENV"

      - name: Sync pre-match odds (next 14 days)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          cmd="python3 scripts/sync_odds_all_leagues.py --days-forward 14"
          if [ "$MODE" = "full" ]; then
            cmd="$cmd --refresh-squads"
          fi
          $cmd

      - name: Debug mapped participant IDs (sqlite)
        run: |
          sqlite3 data/jxd.sqlite "select selection_key, participant_id, line, market_key from odds_outcomes where fixture_id=19427629 and selection_key in ('cole_palmer_anytime','cole_palmer_1_5','morgan_rogers_0_5','wesley_fofana_0_5') order by selection_key, market_key;"

      - name: DB-direct odds ingest (psql)
        if: env.MODE != 'patch'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 scripts/export_odds_to_supabase_psql.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward 14 \
            --progress-rows 10000 \
            --max-runtime-minutes 25 \
            --report-out /tmp/odds_ingest_report.json

      - name: Patch odds participants (psql)
        if: env.MODE == 'patch'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 scripts/patch_odds_participants_psql.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward 14 \
            --report-out /tmp/odds_patch_report.json

      - name: Upload odds patch report
        if: env.MODE == 'patch'
        uses: actions/upload-artifact@v4
        with:
          name: odds_patch_report
          path: /tmp/odds_patch_report.json

      - name: Upload odds ingest report
        if: env.MODE != 'patch'
        uses: actions/upload-artifact@v4
        with:
          name: odds_ingest_report
          path: /tmp/odds_ingest_report.json
