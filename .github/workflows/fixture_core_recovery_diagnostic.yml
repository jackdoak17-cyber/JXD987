name: Fixture Core Recovery Diagnostic

on:
  push:
    branches:
      - diagnostic/fixture-core-recovery-20261102

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load fixture-core contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path("config/fixture_core_contract.json").read_text())
          league_ids = [
              line.strip()
              for line in Path("config/league_ids.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          excluded = set(json.loads(Path("config/odds_api_sync_excluded_leagues.json").read_text()))
          leagues = [value for value in league_ids if int(value) not in excluded]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"STATS_LEAGUES={','.join(leagues)}\n")
              handle.write(f"FIXTURE_CORE_HISTORY_DAYS={contract['history_window_days']}\n")
              handle.write(f"FIXTURE_CORE_SOURCE_DAYS_FORWARD={contract.get('source_window_days_forward', contract['delivery_window_days'] + contract.get('source_buffer_days', 0))}\n")
              handle.write(f"FIXTURE_CORE_DELIVERY_DAYS_FORWARD={contract['delivery_window_days']}\n")
              handle.write(f"FIXTURE_CORE_JOB_ID={contract['job_id']}\n")
              handle.write(f"FIXTURE_CORE_JOB_MAX_AGE_MINUTES={contract['max_job_age_minutes']}\n")
          print("Loaded supported leagues and fixture-core horizons.")
          PY

      - name: Fixture-delivery regression tests
        run: |
          python -m unittest             tests.test_fixture_delivery_release             tests.test_refresh_fixture_delivery             tests.test_fixture_delivery_publisher_contract

      - name: Refresh provider fixture identity
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/sync_odds.py             --leagues "${STATS_LEAGUES}"             --days-back "${FIXTURE_CORE_HISTORY_DAYS}"             --days-forward "${FIXTURE_CORE_SOURCE_DAYS_FORWARD}"             --refresh-upcoming             --no-refresh-squads-missing             --no-refresh-sidelined-window             --refresh-only             --report-out "/tmp/fixture_core_refresh_report.json"             2>&1 | tee /tmp/fixture_core_refresh.log

      - name: Export fixture core to Supabase
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/export_to_supabase.py             --strict             --leagues "${STATS_LEAGUES}"             --days-back "${FIXTURE_CORE_HISTORY_DAYS}"             --upcoming-days "${FIXTURE_CORE_SOURCE_DAYS_FORWARD}"             --fixture-core-only             --skip-odds-snapshots             --skip-odds-outcomes             --skip-prune             --report-json "/tmp/fixture_core_export_report.json"             2>&1 | tee /tmp/fixture_core_export.log

      - name: Publish fixture delivery
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          FIXTURE_DELIVERY_SOURCE_JOB_ID: ${{ env.FIXTURE_CORE_JOB_ID }}
          FIXTURE_DELIVERY_SOURCE_MAX_AGE_MINUTES: ${{ env.FIXTURE_CORE_JOB_MAX_AGE_MINUTES }}
        run: |
          set -euo pipefail
          export FIXTURE_DELIVERY_SOURCE_REFRESHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          python scripts/refresh_fixture_delivery.py             --start-date "$(TZ=Europe/London date -d "-${FIXTURE_CORE_HISTORY_DAYS} days" +%F)"             --end-date "$(TZ=Europe/London date -d "+${FIXTURE_CORE_DELIVERY_DAYS_FORWARD} days" +%F)"             --leagues "${STATS_LEAGUES}"             --report-out "/tmp/fixture_core_delivery_report.json"             2>&1 | tee /tmp/fixture_core_delivery.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-core-recovery-diagnostic
          path: |
            /tmp/fixture_core_refresh_report.json
            /tmp/fixture_core_refresh.log
            /tmp/fixture_core_export_report.json
            /tmp/fixture_core_export.log
            /tmp/fixture_core_delivery_report.json
            /tmp/fixture_core_delivery.log
          if-no-files-found: warn
