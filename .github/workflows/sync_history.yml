name: Sync History

on:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

jobs:
  sync-history:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      RECENT_DAYS: "800"
      EXPORT_DAYS_BACK: "800"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Sync history (kept seasons)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          python3 scripts/run_sync.py --mode full --recent-days "$RECENT_DAYS" --leagues "$LEAGUE_IDS"

      - name: Freshness report
        run: python3 scripts/sqlite_freshness_report.py

      - name: Export to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_EXPORT_CHUNK: "1000"
          SUPABASE_EXPORT_SLEEP: "0"
          SUPABASE_EXPORT_RETRIES: "5"
        run: python3 scripts/export_to_supabase.py --strict --leagues "$LEAGUE_IDS"
