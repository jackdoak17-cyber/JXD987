name: Sync History

on:
  workflow_dispatch:

jobs:
  sync-history:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      RECENT_DAYS: "180"
      EXPORT_DAYS_BACK: "180"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Sync history (kept seasons)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          python3 scripts/run_sync.py --mode recent --recent-days "$RECENT_DAYS" --leagues "$LEAGUE_IDS"

      - name: Freshness report
        run: python3 scripts/sqlite_freshness_report.py

      - name: Export to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_EXPORT_CHUNK: "1000"
          SUPABASE_EXPORT_SLEEP: "0"
          SUPABASE_EXPORT_RETRIES: "5"
        run: |
          python3 scripts/export_to_supabase.py \
            --strict \
            --leagues "$LEAGUE_IDS" \
            --report-json /tmp/export_to_supabase_report.json

      - name: Upload export report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export_to_supabase_report_history
          path: /tmp/export_to_supabase_report.json
          if-no-files-found: ignore

      - name: Publish export gap summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("/tmp/export_to_supabase_report.json")
          if not report_path.exists():
              print("No export report found; skipping gap summary.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          ds = report.get("delete_stats", {}) or {}

          def missed_count(key: str) -> int:
              rows = (ds.get(key, {}) or {}).get("missed_fixture_ids") or []
              return len(rows)

          fp_missed = missed_count("fixture_players")
          fps_missed = missed_count("fixture_player_statistics")
          odds_missed = missed_count("odds_outcomes")
          odds_delete_skipped = bool((ds.get("odds_outcomes", {}) or {}).get("delete_skipped"))
          total_missed = fp_missed + fps_missed + odds_missed

          lines = [
              "## Export Gap Summary (Baseline Mode)",
              f"- fixture_players missed fixtures: {fp_missed}",
              f"- fixture_player_statistics missed fixtures: {fps_missed}",
              f"- odds_outcomes missed fixtures: {odds_missed}",
              f"- odds_outcomes delete skipped: {odds_delete_skipped}",
              f"- total missed fixtures (delete stage): {total_missed}",
              "",
              "> Strict mode is intentionally OFF while we establish baseline miss behavior.",
          ]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\\n".join(lines) + "\\n")
          else:
              print("\\n".join(lines))
          PY
