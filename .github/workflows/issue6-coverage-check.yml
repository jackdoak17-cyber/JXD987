name: Issue 6 Coverage Unit Verification
on:
  push:
    branches: [checks/issue6-monitoring-20261024]
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reporting dependency
        run: python -m pip install psycopg2-binary
      - name: Python compilation
        run: python -m py_compile scripts/report_customer_odds_coverage.py tests/test_customer_odds_coverage.py
      - name: Customer and existing moneyline validator unit tests
        run: PYTHONPATH=. python -m unittest tests.test_customer_odds_coverage tests.test_validate_moneyline_coverage -v
