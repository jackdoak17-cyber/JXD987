name: Fixture Delivery Production Failover

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: fixture-delivery-production-failover
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      PGSSLMODE: require
      SOURCE_RECOVERY_MARGIN_MINUTES: "480"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load fixture-core contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path("config/fixture_core_contract.json").read_text())
          configured = [
              int(line.strip())
              for line in Path("config/league_ids.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          excluded = set(json.loads(Path("config/odds_api_sync_excluded_leagues.json").read_text()))
          leagues = [str(value) for value in configured if value not in excluded]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"STATS_LEAGUES={','.join(leagues)}\n")
              handle.write(f"FIXTURE_CORE_HISTORY_DAYS={contract['history_window_days']}\n")
              handle.write(f"FIXTURE_CORE_SOURCE_DAYS_FORWARD={contract.get('source_window_days_forward', contract['delivery_window_days'] + contract.get('source_buffer_days', 0))}\n")
              handle.write(f"FIXTURE_CORE_DELIVERY_DAYS_FORWARD={contract['delivery_window_days']}\n")
              handle.write(f"FIXTURE_CORE_JOB_MAX_AGE_MINUTES={contract['max_job_age_minutes']}\n")
          PY

      - name: Inspect production source freshness
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
        run: |
          set -euo pipefail
          row="$(
            psql "${SUPABASE_DB_URL_SESSION}" -At -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          with freshest as (
            select job_id, finished_at,
                   floor(extract(epoch from (now() - finished_at)) / 60)::integer as age_minutes
              from operations.pipeline_job_runs
             where job_id in ('run_p3_fixture_core_export', 'run_fixture_core_fallback')
               and status = 'success'
               and finished_at is not null
             order by finished_at desc
             limit 1
          )
          select coalesce(job_id, ''), coalesce(age_minutes, 999999)
            from freshest
          union all
          select '', 999999
           where not exists (select 1 from freshest)
          limit 1;
          SQL
          )"
          IFS='|' read -r source_job_id source_age_minutes <<<"${row}"
          echo "Freshest fixture source: job=${source_job_id:-none} age_minutes=${source_age_minutes}"
          echo "SOURCE_JOB_ID=${source_job_id}" >> "${GITHUB_ENV}"
          echo "SOURCE_AGE_MINUTES=${source_age_minutes}" >> "${GITHUB_ENV}"
          if (( source_age_minutes >= SOURCE_RECOVERY_MARGIN_MINUTES )); then
            echo "NEEDS_SOURCE_RECOVERY=true" >> "${GITHUB_ENV}"
          else
            echo "NEEDS_SOURCE_RECOVERY=false" >> "${GITHUB_ENV}"
          fi

      - name: Recover provider fixture source
        if: env.NEEDS_SOURCE_RECOVERY == 'true'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/sync_odds.py             --leagues "${STATS_LEAGUES}"             --days-back "${FIXTURE_CORE_HISTORY_DAYS}"             --days-forward "${FIXTURE_CORE_SOURCE_DAYS_FORWARD}"             --refresh-upcoming             --no-refresh-squads-missing             --no-refresh-sidelined-window             --refresh-only             --report-out "/tmp/fixture_failover_refresh_report.json"             2>&1 | tee /tmp/fixture_failover_refresh.log

      - name: Export recovered fixture source
        if: env.NEEDS_SOURCE_RECOVERY == 'true'
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/export_to_supabase.py             --strict             --leagues "${STATS_LEAGUES}"             --days-back "${FIXTURE_CORE_HISTORY_DAYS}"             --upcoming-days "${FIXTURE_CORE_SOURCE_DAYS_FORWARD}"             --fixture-core-only             --skip-odds-snapshots             --skip-odds-outcomes             --skip-prune             --report-json "/tmp/fixture_failover_export_report.json"             2>&1 | tee /tmp/fixture_failover_export.log

      - name: Record verified fallback source
        if: env.NEEDS_SOURCE_RECOVERY == 'true'
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
        run: |
          set -euo pipefail
          started_at="$(date -u -d '-1 minute' +'%Y-%m-%dT%H:%M:%SZ')"
          finished_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          psql "${SUPABASE_DB_URL_SESSION}" -v ON_ERROR_STOP=1             -v started_at="${started_at}" -v finished_at="${finished_at}"             -v run_id="${GITHUB_RUN_ID}" -v run_sha="${GITHUB_SHA}" <<'SQL'
          insert into operations.pipeline_job_runs (
            job_id, job_name, status, started_at, finished_at, duration_ms,
            release_id, evidence_summary
          )
          values (
            'run_fixture_core_fallback',
            'Fixture core GitHub failover',
            'success',
            :'started_at'::timestamptz,
            :'finished_at'::timestamptz,
            60000,
            left(:'run_sha', 12),
            'GitHub Actions failover source refresh/export succeeded; run_id=' || :'run_id'
          );
          SQL
          echo "SOURCE_JOB_ID=run_fixture_core_fallback" >> "${GITHUB_ENV}"
          echo "SOURCE_AGE_MINUTES=0" >> "${GITHUB_ENV}"

      - name: Publish or renew fixture delivery
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          FIXTURE_DELIVERY_SOURCE_JOB_ID: ${{ env.SOURCE_JOB_ID }}
          FIXTURE_DELIVERY_SOURCE_MAX_AGE_MINUTES: ${{ env.FIXTURE_CORE_JOB_MAX_AGE_MINUTES }}
        run: |
          set -euo pipefail
          if [[ -z "${FIXTURE_DELIVERY_SOURCE_JOB_ID}" ]]; then
            echo "No verified fixture source job is available." >&2
            exit 1
          fi
          python scripts/refresh_fixture_delivery.py             --start-date "$(TZ=Europe/London date -d "-${FIXTURE_CORE_HISTORY_DAYS} days" +%F)"             --end-date "$(TZ=Europe/London date -d "+${FIXTURE_CORE_DELIVERY_DAYS_FORWARD} days" +%F)"             --leagues "${STATS_LEAGUES}"             --report-out "/tmp/fixture_failover_delivery_report.json"             2>&1 | tee /tmp/fixture_failover_delivery.log

      - name: Verify customer release is current
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL_SESSION}" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            resolved_state text;
            remaining interval;
          begin
            select state into resolved_state
              from public.fixture_delivery_release_resolve(null::uuid)
              limit 1;
            if resolved_state is distinct from 'current' then
              raise exception 'fixture release is not current: %', resolved_state;
            end if;

            select r.pin_expires_at - now()
              into remaining
              from public.fixture_delivery_current_publication p
              join public.fixture_delivery_releases r on r.id = p.release_id
             where p.publication_key = 'fixtures';
            if remaining is null or remaining < interval '45 minutes' then
              raise exception 'fixture release lease is too short: %', remaining;
            end if;
          end
          $$;
          SQL

      - name: Upload failover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-delivery-failover-evidence
          path: |
            /tmp/fixture_failover_refresh_report.json
            /tmp/fixture_failover_refresh.log
            /tmp/fixture_failover_export_report.json
            /tmp/fixture_failover_export.log
            /tmp/fixture_failover_delivery_report.json
            /tmp/fixture_failover_delivery.log
          if-no-files-found: ignore
