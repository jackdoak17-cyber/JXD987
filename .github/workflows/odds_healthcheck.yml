name: Odds Healthcheck

on:
  schedule:
    # GitHub Actions cron uses UTC. This targets ~03:00 Europe/London.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SESSION }}
      PGSSLMODE: require
      DAYS_FORWARD: "14"
      SAMPLE_SIZE: "5"
      RUN_COVERAGE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Supabase DB preflight (psql)
        continue-on-error: true
        env:
          REPORT_PATH: /tmp/odds_preflight_healthcheck.json
          STDERR_PATH: /tmp/odds_preflight_healthcheck_err.txt
        run: |
          : > "$STDERR_PATH"
          python3 scripts/preflight_supabase_psql.py \
            --report-out "$REPORT_PATH" \
            --stderr-out "$STDERR_PATH"

      - name: Select leagues with upcoming fixtures
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg2

          db_url = os.environ.get("SUPABASE_DB_URL")

          days = int(os.environ.get("DAYS_FORWARD", "14"))
          leagues = []
          if db_url:
              try:
                  conn = psycopg2.connect(db_url)
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          select distinct league_id
                          from public.fixtures
                          where starting_at >= (now() at time zone 'utc')
                            and starting_at < (now() at time zone 'utc') + interval %s
                            and league_id is not null
                          order by league_id;
                          """,
                          (f"{days} days",),
                      )
                      leagues = [str(row[0]) for row in cur.fetchall()]
                  conn.close()
              except Exception as exc:
                  print(f"Failed to query fixtures for leagues: {exc}")

          if not leagues:
              fallback = Path("config/league_ids.txt")
              if fallback.exists():
                  leagues = [line.strip() for line in fallback.read_text().splitlines() if line.strip()]

          if not leagues:
              print("No leagues found for healthcheck.")
              leagues = []

          leagues_csv = ",".join(leagues)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"LEAGUE_IDS={leagues_csv}\n")
          print(f"LEAGUE_IDS={leagues_csv}")
          PY

      - name: Core markets validation (sample)
        if: env.LEAGUE_IDS != ''
        continue-on-error: true
        run: |
          python3 scripts/validate_core_markets.py \
            --leagues "$LEAGUE_IDS" \
            --days-forward "$DAYS_FORWARD" \
            --sample-size "$SAMPLE_SIZE" \
            --out-json /tmp/core_markets_report.json \
            --out-md /tmp/core_markets_report.md

      - name: Build healthcheck report
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg2
          from datetime import datetime

          db_url = os.environ.get("SUPABASE_DB_URL")

          core_path = Path("/tmp/core_markets_report.json")
          report = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "days_forward": int(os.environ.get("DAYS_FORWARD", "14")),
              "sample_size": int(os.environ.get("SAMPLE_SIZE", "5")),
              "leagues": [],
              "error": None,
          }
          if core_path.exists():
              report = json.loads(core_path.read_text())
          else:
              report["error"] = "Missing core markets report."

          days_forward = int(os.environ.get("DAYS_FORWARD", "14"))
          if db_url and report.get("leagues"):
              try:
                  conn = psycopg2.connect(db_url)
                  with conn.cursor() as cur:
                      for league in report.get("leagues", []):
                          league_id = league.get("league_id")
                          cur.execute(
                              """
                              select max(o.last_updated_at)
                              from public.odds_outcomes o
                              join public.fixtures f on f.id = o.fixture_id
                              where f.league_id = %s
                                and f.starting_at >= (now() at time zone 'utc')
                                and f.starting_at < (now() at time zone 'utc') + interval %s;
                              """,
                              (league_id, f"{days_forward} days"),
                          )
                          latest = cur.fetchone()[0]
                          league["max_last_updated_at"] = latest.isoformat() if latest else None
                  conn.close()
              except Exception as exc:
                  report["error"] = f"Failed to load last_updated_at: {exc}"

          report["generated_at"] = datetime.utcnow().isoformat() + "Z"
          out_json = Path("/tmp/odds_health_report.json")
          out_json.write_text(json.dumps(report, indent=2), encoding="utf-8")

          lines = ["# Odds Healthcheck Report", "", f"Generated: {report['generated_at']}", ""]
          for league in report.get("leagues", []):
              lines.append(f"## League {league.get('league_id')}")
              lines.append("")
              lines.append(f"Max last_updated_at: {league.get('max_last_updated_at')}")
              lines.append("")
              lines.append("| Market | Availability % | Mapping % |")
              lines.append("|---|---:|---:|")
              for market_key, availability in league.get("availability", {}).items():
                  mapping = league.get("mapping", {}).get(market_key, {})
                  lines.append(
                      f"| {market_key} | {availability.get('availability_pct', 0):.2f} | "
                      f"{mapping.get('correct_pct', 0):.2f} |"
                  )
              lines.append("")

          out_md = Path("/tmp/odds_health_report.md")
          out_md.write_text("\\n".join(lines), encoding="utf-8")
          print(f"Wrote {out_json} and {out_md}")
          PY

      - name: Upload core markets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_health_core_markets
          path: |
            /tmp/core_markets_report.json
            /tmp/core_markets_report.md
          if-no-files-found: ignore

      - name: Upload healthcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds_health_report
          path: |
            /tmp/odds_health_report.json
            /tmp/odds_health_report.md
          if-no-files-found: ignore
