name: Golden Checks

on:
  workflow_dispatch:
    inputs:
      official_standings_contract:
        description: "Validate fixture-backed official standings only (no writes)"
        required: false
        type: boolean
        default: false
      official_standings_publish:
        description: "Publish validated official standings to Production"
        required: false
        type: boolean
        default: false
      official_standings_all_fixture_seasons:
        description: "Include the reviewed historical fixture-backed seasons"
        required: false
        type: boolean
        default: false

jobs:
  golden:
    if: ${{ !inputs.official_standings_contract && !inputs.official_standings_publish }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      LEAGUE_ID: "8"
      TEAM_ID: "19"
      PLAYER_NAME: "Bukayo Saka"
      EXPECTED_SAKA_SHOTS_LAST10: "1,4,2,3,3,3,2,1,2,4"
      EXPECTED_ARSENAL_RESULTS_LAST5: "W 2-1,L 2-1,W 2-0,D 1-1,W 4-1"
      EXPECTED_ARSENAL_YELLOWS_LAST5: "0,2,0,6,1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full sync (Premier League)
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: python3 scripts/run_sync.py --mode full --leagues "8"

      - name: Freshness report
        run: python3 scripts/sqlite_freshness_report.py

      - name: Golden checks (SQLite)
        run: python3 scripts/golden_checks.py --backend sqlite --league-id 8 --team-id 19 --player-name "Bukayo Saka"

      - name: Export to Supabase
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/export_to_supabase.py --strict --atomic-fixture-detail

      - name: Golden checks (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/golden_checks.py --backend supabase --league-id 8 --team-id 19 --player-name "Bukayo Saka"

  official-standings-contract:
    if: ${{ inputs.official_standings_contract || inputs.official_standings_publish }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate or publish the selected official standings scope
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
          PUBLISH: ${{ inputs.official_standings_publish }}
          ALL_FIXTURE_SEASONS: ${{ inputs.official_standings_all_fixture_seasons }}
        run: |
          LEAGUES="$(python3 - <<'PY'
          import json
          from pathlib import Path

          all_leagues = {
              int(value)
              for value in Path("config/league_ids.txt").read_text().splitlines()
              if value.strip()
          }
          excluded = set(json.loads(Path("config/odds_api_sync_excluded_leagues.json").read_text()))
          print(",".join(str(value) for value in sorted(all_leagues - excluded)))
          PY
          )"
          args=(
            --leagues "${LEAGUES}"
            --expect-standing "27903:65:6:27"
            --report-out official-standings-contract.json
          )
          if [[ "${ALL_FIXTURE_SEASONS}" == "true" ]]; then
            args+=(--all-fixture-seasons --continue-on-error)
          fi
          if [[ "${PUBLISH}" != "true" ]]; then
            args+=(--dry-run)
          fi

          set +e
          python3 scripts/sync_official_standings.py "${args[@]}"
          sync_status=$?
          set -e

          python3 - "${ALL_FIXTURE_SEASONS}" "${sync_status}" <<'PY'
          import json
          import sys
          from pathlib import Path

          include_history = sys.argv[1] == "true"
          exit_status = int(sys.argv[2])
          report = json.loads(Path("official-standings-contract.json").read_text())
          failures = [
              (row.get("league_id"), row.get("season_id"), row.get("error"))
              for row in report.get("seasons", [])
              if row.get("status") == "failed"
          ]
          if include_history:
              expected = [(989, 22847, "SportMonks returned no standings")]
              if failures != expected or exit_status != 1:
                  raise SystemExit(
                      f"historical exception drift: status={exit_status} failures={failures!r}"
                  )
              successful = [
                  row for row in report.get("seasons", [])
                  if row.get("status") in {"validated", "published"}
              ]
              if len(successful) != 71:
                  raise SystemExit(f"expected 71 validated historical/current seasons; got {len(successful)}")
          elif failures or exit_status != 0 or report.get("status") != "succeeded":
              raise SystemExit(
                  f"current standings publication failed: status={exit_status} failures={failures!r}"
              )
          PY

      - name: Upload sanitised contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-standings-contract-${{ github.run_id }}
          path: official-standings-contract.json
          if-no-files-found: error
