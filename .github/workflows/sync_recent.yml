name: Sync Recent

on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      team_history_days:
        description: "Provider history lookback for upcoming-team backfill"
        required: false
        default: "365"
      team_history_batch_size:
        description: "Maximum teams fetched in this run"
        required: false
        default: "25"
      team_history_batch_index:
        description: "Optional batch index; blank rotates by UTC day"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    # A provider stall must produce a visible failed run, never an unbounded
    # Actions job that prevents the next scheduled refresh from starting.
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      # Daily runs only need to refresh the recent form/stat window. Older
      # rows remain in Supabase, so keeping this bounded prevents the export
      # from repeatedly reprocessing an entire season.
      RECENT_DAYS: "30"
      EXPORT_DAYS_BACK: "30"
      SPORTMONKS_TIMEOUT_SECONDS: "20"
      SPORTMONKS_MAX_RETRIES: "3"
      SM_RATE_LIMIT_RETRIES: "2"
      SM_RATE_LIMIT_SLEEP_BASE: "2"
      SM_RATE_LIMIT_SLEEP_MAX: "15"
      TEAM_HISTORY_DAYS: ${{ github.event.inputs.team_history_days || '365' }}
      TEAM_HISTORY_BATCH_SIZE: ${{ github.event.inputs.team_history_batch_size || '25' }}
      TEAM_HISTORY_BATCH_INDEX: ${{ github.event.inputs.team_history_batch_index || '' }}
      TEAM_HISTORY_MIN_MATCHES: "5"
      TEAM_HISTORY_EXPORT_DAYS: "365"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Sync recent window
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          sync_args=(
            --mode recent
            --recent-days "$RECENT_DAYS"
            --leagues "$LEAGUE_IDS"
            --team-history-days "$TEAM_HISTORY_DAYS"
            --team-history-min-matches "$TEAM_HISTORY_MIN_MATCHES"
            --team-history-batch-size "$TEAM_HISTORY_BATCH_SIZE"
          )
          if [[ -n "$TEAM_HISTORY_BATCH_INDEX" ]]; then
            sync_args+=(--team-history-batch-index "$TEAM_HISTORY_BATCH_INDEX")
          fi
          python3 scripts/run_sync.py "${sync_args[@]}"

      - name: Freshness report
        run: python3 scripts/sqlite_freshness_report.py

      - name: Export recent fixture core to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_EXPORT_CHUNK: "1000"
          SUPABASE_EXPORT_SLEEP: "0"
          SUPABASE_EXPORT_RETRIES: "5"
          # The daily workflow is the time-critical fixture publisher. Do not
          # reprocess hundreds of thousands of player-stat rows here: the
          # sharded Sync History workflow publishes those detail tables. Core
          # rows must reach Supabase before the 20-minute Actions budget.
          EXPORT_DAYS_BACK: "30"
        run: |
          python3 scripts/export_to_supabase.py \
            --strict \
            --fixture-core-only \
            --days-back "$EXPORT_DAYS_BACK" \
            --upcoming-days 14 \
            --skip-prune \
            --leagues "$LEAGUE_IDS"

      - name: Export provider-confirmed team history core
        if: ${{ env.TEAM_HISTORY_DAYS != '0' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_EXPORT_CHUNK: "1000"
          SUPABASE_EXPORT_SLEEP: "0"
          SUPABASE_EXPORT_RETRIES: "5"
        run: |
          # Team-scoped history can belong to a competition outside the menu
          # allowlist. Export only confirmed core fixture rows and never prune
          # unrelated seasons or detailed player/stat rows.
          python3 scripts/export_to_supabase.py \
            --fixture-core-only \
            --days-back "$TEAM_HISTORY_EXPORT_DAYS" \
            --upcoming-days 14 \
            --skip-prune \
            --leagues "" \
            --report-json /tmp/team_history_export_report.json

      - name: Upload team history export report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team_history_export_report
          path: /tmp/team_history_export_report.json
          if-no-files-found: ignore

      - name: Refresh likely players
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for league_id in ${LEAGUE_IDS//,/ }; do
            curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_likely_players" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_league_id\":${league_id},\"p_recent_days\":30,\"p_last_n\":1}"
          done
