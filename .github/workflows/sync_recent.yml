name: Sync Recent

on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # A provider stall must produce a visible failed run, never an unbounded
    # Actions job that prevents the next scheduled refresh from starting.
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      # Daily runs only need to refresh the recent form/stat window. Older
      # rows remain in Supabase, so keeping this bounded prevents the export
      # from repeatedly reprocessing an entire season.
      RECENT_DAYS: "30"
      EXPORT_DAYS_BACK: "30"
      SPORTMONKS_TIMEOUT_SECONDS: "20"
      SPORTMONKS_MAX_RETRIES: "3"
      SM_RATE_LIMIT_RETRIES: "2"
      SM_RATE_LIMIT_SLEEP_BASE: "2"
      SM_RATE_LIMIT_SLEEP_MAX: "15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load league ids
        run: |
          echo "LEAGUE_IDS=$(paste -sd, config/league_ids.txt)" >> $GITHUB_ENV

      - name: Sync recent window
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          python3 scripts/run_sync.py --mode recent --recent-days "$RECENT_DAYS" --leagues "$LEAGUE_IDS"

      - name: Freshness report
        run: python3 scripts/sqlite_freshness_report.py

      - name: Export to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_EXPORT_CHUNK: "1000"
          SUPABASE_EXPORT_SLEEP: "0"
          SUPABASE_EXPORT_RETRIES: "5"
          # Keep the export bounded to the same recent window as the sync.
          # Historical rows are retained in Supabase by the sharded history
          # workflow; reprocessing 240 days here defeats the runtime bound.
          EXPORT_DAYS_BACK: "30"
        run: python3 scripts/export_to_supabase.py --strict --leagues "$LEAGUE_IDS"

      - name: Refresh likely players
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for league_id in ${LEAGUE_IDS//,/ }; do
            curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_likely_players" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_league_id\":${league_id},\"p_recent_days\":30,\"p_last_n\":1}"
          done
